services:
  # ---------------------------------------------
  # 1. POSTGRESQL (Serving Layer / Gold Warehouse)
  # ---------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: traffic_postgres
    restart: always
    environment:
      POSTGRES_DB: traffic_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------------------------
  # 2. MINIO (Object Storage - Bronze & Silver)
  # ---------------------------------------------
  minio:
    image: alpine/minio:latest-release
    container_name: traffic_minio
    user: "0:0"
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ---------------------------------------------
  # 3. KAFKA (Stream Buffer - KRaft Mode, No Zookeeper)
  # ---------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: traffic_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  # ---------------------------------------------
  # 4. AIRFLOW WEBSERVER & SCHEDULER (LocalExecutor)
  # ---------------------------------------------
  airflow-init:
    image: apache/airflow:2.8.1-python3.10
    container_name: traffic_airflow_init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-traffic_dw}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: >
      bash -c "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@traffic.local --password admin || true"
    depends_on:
      - postgres

  airflow-webserver:
    image: apache/airflow:2.8.1-python3.10
    container_name: traffic_airflow_webserver
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-traffic_dw}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      _PIP_ADDITIONAL_REQUIREMENTS: requests python-dotenv minio pandas pyarrow psycopg2-binary dbt-postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: traffic_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TOMTOM_API_KEY: ${TOMTOM_API_KEY}
    ports:
      - "8080:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../collector:/opt/airflow/collector
      - ../config:/opt/airflow/config
      - ../spark:/opt/airflow/spark
      - ../dbt:/opt/airflow/dbt
      - ../data:/opt/airflow/data
    depends_on:
      - postgres
      - airflow-init
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.10
    container_name: traffic_airflow_scheduler
    restart: always
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-traffic_dw}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      _PIP_ADDITIONAL_REQUIREMENTS: requests python-dotenv minio pandas pyarrow psycopg2-binary dbt-postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: traffic_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TOMTOM_API_KEY: ${TOMTOM_API_KEY}
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../collector:/opt/airflow/collector
      - ../config:/opt/airflow/config
      - ../spark:/opt/airflow/spark
      - ../dbt:/opt/airflow/dbt
      - ../data:/opt/airflow/data
    depends_on:
      - postgres
      - airflow-init
    command: scheduler

  # ---------------------------------------------
  # 5. WEB APPLICATION (FastAPI + Leaflet GIS Dashboard)
  # ---------------------------------------------
  web-app:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: traffic_web_app
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: traffic_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ../web:/app/web
      - ../config:/app/config
    depends_on:
      - postgres

volumes:
  postgres_data:
  minio_data:
