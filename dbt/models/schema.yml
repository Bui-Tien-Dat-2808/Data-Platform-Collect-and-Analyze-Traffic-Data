version: 2

models:
  - name: fact_traffic_flow_15min
    description: "Bảng sự kiện lưu trạng thái lưu thông 15 phút tại từng điểm giám sát"
    columns:
      - name: fact_id
        tests:
          - unique
          - not_null
      - name: current_speed_kmh
        tests:
          - not_null
      - name: speed_reduction_ratio_pct
        tests:
          - not_null
      - name: congestion_level
        tests:
          - accepted_values:
              values: ['LOW / FREE_FLOW', 'MODERATE', 'HEAVY / CONGESTED']

  - name: fact_hourly_traffic_summary
    description: "Bảng tổng hợp vận tốc và độ trễ theo từng giờ"
    columns:
      - name: point_id
        tests:
          - not_null
      - name: hourly_congestion_status
        tests:
          - accepted_values:
              values: ['SMOOTH', 'SLIGHT_DELAY', 'SEVERE_CONGESTION']

  - name: fact_traffic_incidents
    description: "Bảng sự kiện từng sự cố giao thông toàn Hà Nội (accidents, traffic jams, road closures)"
    columns:
      - name: fact_id
        tests:
          - unique
          - not_null
      - name: incident_id
        tests:
          - not_null
      - name: incident_type
        tests:
          - not_null
      - name: fetched_at_utc
        tests:
          - not_null

  - name: dim_incident_type
    description: "Bảng chiều danh mục chuẩn hóa phân loại sự cố giao thông"
    columns:
      - name: incident_type
        tests:
          - unique
          - not_null
      - name: type_label
        tests:
          - not_null

  - name: agg_hourly_incident_summary
    description: "Bảng tổng hợp số lượng và độ trễ sự cố giao thông theo từng giờ và ngày"
    columns:
      - name: date_key
        tests:
          - not_null
      - name: hour_key
        tests:
          - not_null
      - name: incident_type
        tests:
          - not_null

